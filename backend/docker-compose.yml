services:
  mongodb:
    image: mongo:7
    container_name: signvoice_mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    # Local development only. Transactions require a replica set.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'try { if (rs.status().myState !== 1) quit(1); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); quit(1); }']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - signvoice-network

volumes:
  mongodb_data:
    name: signvoice_mongodb_data

networks:
  signvoice-network:
    name: signvoice-network
