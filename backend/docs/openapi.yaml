  /api/v1/admin/users/{id}/password:
    post:
      tags: [Admin]
      operationId: resetAdminUserPassword
      summary: Admin resets another local account's password and revokes old sessions
      description: Requires users:write and all target-account permissions. Rejects self, guest/social and deleted targets. Preserves suspended status. Atomically increments passwordVersion, clears password-reset tokens, revokes sessions and records a password-free audit.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 8, maxLength: 128, writeOnly: true, description: Must contain a letter and a digit }
      responses:
        '200': { description: Password reset; target must sign in again; actor session remains valid. No password or password hash returned. }
        '400': { description: Invalid ID/password, unsupported account, self reset or unknown field }
        '401': { description: Authentication required }
        '403': { description: Missing admin/users:write permission or target has greater permissions }
        '404': { description: Target account missing or deleted }
