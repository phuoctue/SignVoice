      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
                direction:
                  type: string
                  enum:
                    - TEXT
                    - SIGN_TO_SPEECH
                    - SPEECH_TO_TEXT
                  default: TEXT
                favorite:
                  type: boolean
                  default: false
    delete:
      tags:
        - User data
      summary: Xóa một hội thoại thuộc tài khoản hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực hoặc phiên đã bị thu hồi
        "403":
          description: Không đủ quyền
        "404":
          description: Không tìm thấy dữ liệu thuộc tài khoản
      parameters:
        - *a1
  /api/v1/users/data/export:
    get:
      tags:
        - User data
      summary: Xuất JSON dữ liệu thuộc tài khoản; không chứa token hoặc mật khẩu
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: "#/components/schemas/AuthUser"
                      settings:
                        $ref: "#/components/schemas/UserSettings"
                      favorites:
                        type: array
                        items:
                          $ref: "#/components/schemas/Favorite"
                      conversations:
                        type: array
                        items:
                          $ref: "#/components/schemas/Conversation"
                      searchHistory:
                        type: array
                        items:
                          $ref: "#/components/schemas/SearchHistory"
                      exportedAt:
                        type: string
                        format: date-time
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực hoặc phiên đã bị thu hồi
        "403":
          description: Không đủ quyền
        "404":
          description: Không tìm thấy dữ liệu thuộc tài khoản
  /api/v1/users/data:
    delete:
      tags:
        - User data
      summary: Xóa dữ liệu cá nhân và đặt lại cài đặt trong transaction; giữ tài khoản
        và phiên
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: object
                        properties:
                          favorites:
                            type: integer
                          conversations:
                            type: integer
                          searchHistory:
                            type: integer
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực hoặc phiên đã bị thu hồi
        "403":
          description: Không đủ quyền
        "404":
          description: Không tìm thấy dữ liệu thuộc tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - confirm
              properties:
                confirm:
                  type: boolean
                  enum:
                    - true
  /api/v1/users/account:
    delete:
      tags:
        - User data
      summary: Xóa tài khoản, phiên và dữ liệu thuộc tài khoản trong transaction
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực hoặc phiên đã bị thu hồi
        "403":
          description: Không đủ quyền
        "404":
          description: Không tìm thấy dữ liệu thuộc tài khoản
        "409":
          description: Phải giữ ít nhất một quản trị viên hoạt động
      description: LOCAL cần currentPassword đúng. Mọi loại tài khoản cần
        confirm=true. Từ chối xóa quản trị viên hoạt động cuối cùng. Sai mật
        khẩu trả 400 và giữ phiên.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - confirm
              properties:
                confirm:
                  type: boolean
                  enum:
                    - true
                currentPassword:
                  type: string
                  maxLength: 128
                  writeOnly: true
  /api/v1/users/sessions:
    get:
      tags:
        - User data
      summary: Liệt kê phiên refresh còn hiệu lực của tài khoản, không trả token/hash
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        deviceInfo:
                          type: string
                        ipAddress:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        current:
                          type: boolean
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực hoặc phiên đã bị thu hồi
        "403":
          description: Không đủ quyền
        "404":
          description: Không tìm thấy dữ liệu thuộc tài khoản
  /api/v1/users/sessions/{id}:
    delete:
      tags:
        - User data
      summary: Thu hồi cả session family thuộc tài khoản; đánh dấu khi là thiết bị
        hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      revokedCurrent:
                        type: boolean
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực hoặc phiên đã bị thu hồi
        "403":
          description: Không đủ quyền
        "404":
          description: Không tìm thấy dữ liệu thuộc tài khoản
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
  /api/v1/sign-sequence:
    post:
      tags:
        - Dictionary
      summary: Ghép văn bản thành chuỗi media từ điển đã xuất bản
      description: >-
        Ưu tiên cụm từ dài nhất và tên mục từ chính xác trước tên thay thế.
        Khi không có mục từ riêng, trả fingerspelling nếu có đủ media chữ cái;
        letters chứa các đoạn sign theo thứ tự, hasTone cho biết văn bản có dấu thanh.
        Đánh vần không thay thế bản dịch ngữ pháp hay ký hiệu riêng của cả từ.
        Không sử dụng hoặc mở rộng bộ nhận diện camera 181 từ.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: Chuỗi ký hiệu, từ thiếu hoặc media thiếu được đánh dấu rõ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Văn bản không hợp lệ
        "401":
          description: Chưa xác thực
        "403":
          description: Khách chưa bắt đầu phiên thử hoặc đã hết 10 phút
        "503":
          description: Kho vượt giới hạn, cần lập chỉ mục
  /sign-media/license/{name}:
    get:
      tags:
        - Dictionary
      summary: Đọc giấy phép của media tham chiếu
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum:
              - apache-2.0
              - cc-by-4.0
      responses:
        "200":
          description: Giấy phép
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Không tìm thấy giấy phép
  /sign-media/{file}:
    get:
      tags:
        - Dictionary
      summary: Đọc media có tham chiếu từ mục đã xuất bản, hỗ trợ byte range
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-1023
      responses:
        "200":
          description: Media
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Nội dung theo byte range
        "404":
          description: File không tồn tại hoặc không có tham chiếu được xuất bản

  /api/v1/guest-trial/status:
    get:
      tags: [Authentication]
      summary: Xem trạng thái phiên dùng thử, không bắt đầu tính giờ
      security:
        - bearerAuth: []
      parameters:
        - name: deviceKey
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
          description: Định danh hạn dùng của bản cài đặt, dùng khi gắn tài khoản khách cũ; không phải token đăng nhập.
      responses:
        '200':
          description: Thời điểm máy chủ và trạng thái hạn dùng; tài khoản chính thức có state unlimited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GuestTrialStatus'
        '401':
          description: Chưa xác thực
  /api/v1/guest-trial/start:
    post:
      tags: [Authentication]
      summary: Bắt đầu một phiên thử 600 giây hoặc trả lại hạn cũ
      description: Bắt đầu nguyên tử trên máy chủ; gọi lại, refresh hoặc tải lại trang không gia hạn. Phiên đã hết vẫn trả expired.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deviceKey:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
      responses:
        '200':
          description: Trạng thái phiên thử
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GuestTrialStatus'
        '400':
          description: Không chấp nhận thời hạn hoặc trường ngoài schema từ client
        '401':
          description: Chưa xác thực
  /api/v1/guest-trial/ai-ticket:
    post:
      tags: [Authentication]
      summary: Cấp ticket 30 giây để mở WebSocket AI
      description: Kết nối tới /sign-ai/v1/stream?ticket=...; gateway bỏ ticket trước khi chuyển tới AI và đóng kết nối khách tại expiresAt. Không ghi ticket vào log.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ticket chỉ dùng cho kết nối AI, không thay access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
        '401':
          description: Phiên xác thực không còn hợp lệ
        '403':
          description: Phiên thử chưa bắt đầu hoặc đã hết hạn
