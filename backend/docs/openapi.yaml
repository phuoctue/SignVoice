  /api/v1/sign-sequence:
    post:
      tags:
        - Dictionary
      summary: Ghép văn bản thành chuỗi media từ điển đã xuất bản
      description: >-
        Ưu tiên cụm từ dài nhất và tên mục từ chính xác trước tên thay thế.
        Khi không có mục từ riêng, trả fingerspelling nếu có đủ media chữ cái;
        letters chứa các đoạn sign theo thứ tự, hasTone cho biết văn bản có dấu thanh.
        Đánh vần không thay thế bản dịch ngữ pháp hay ký hiệu riêng của cả từ.
        Không sử dụng hoặc mở rộng bộ nhận diện camera 181 từ.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: Chuỗi ký hiệu, từ thiếu hoặc media thiếu được đánh dấu rõ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Văn bản không hợp lệ
        "401":
          description: Chưa xác thực
        "403":
          description: Khách chưa bắt đầu phiên thử hoặc đã hết 10 phút
        "503":
          description: Kho vượt giới hạn, cần lập chỉ mục
