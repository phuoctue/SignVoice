  # Users
  /api/v1/users/bootstrap:
    get:
      tags: [Users]
      summary: Tải dữ liệu khởi động tài khoản trong một yêu cầu
      description: Trả profile an toàn, settings, trang đầu tối đa 20 hội thoại và toàn bộ ID yêu thích có từ PUBLISHED trong danh mục ACTIVE. Chỉ dữ liệu của tài khoản xác thực; Cache-Control no-store. Các API riêng vẫn được hỗ trợ.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Dữ liệu khởi động
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [profile, settings, conversations, favorites]
                    properties:
                      profile: {$ref: '#/components/schemas/User'}
                      settings: {$ref: '#/components/schemas/UserSettings'}
                      conversations:
                        type: object
                        properties:
                          items: {type: array, items: {type: object}}
                          total: {type: integer}
                          page: {type: integer, enum: [1]}
                          pages: {type: integer}
                      favorites:
                        type: array
                        items:
                          type: object
                          properties:
                            entryId: {type: string}
        '400': {description: Không chấp nhận query bổ sung}
        '401': {description: Phiên không hợp lệ}
        '404': {description: Tài khoản không tồn tại}
  /api/v1/users/profile:
    get:
      tags:
        - Users
      summary: Lấy hồ sơ người dùng
      description: Trả về thông tin hồ sơ người dùng hiện tại
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

    patch:
      tags:
        - Users
      summary: Cập nhật hồ sơ
      description: Cập nhật thông tin hồ sơ người dùng
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 50
                avatarUrl:
                  type: string
                  description: URL HTTP/HTTPS, đường dẫn ảnh thuộc chính tài khoản hoặc chuỗi rỗng để xóa. Không gửi cùng avatarImage.
                avatarImage:
                  type: string
                  maxLength: 700000
                  writeOnly: true
                  description: Data URL base64 JPEG/PNG/WebP, tối đa 512 KB sau giải mã. Không gửi cùng avatarUrl.
                email:
                  type: string
                  format: email
                currentPassword:
                  type: string
                  writeOnly: true
                  description: Bắt buộc khi đổi email của tài khoản LOCAL
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        "400":
          description: Dữ liệu không hợp lệ hoặc mật khẩu chứng minh sai; không làm mất
            phiên đăng nhập
        "409":
          description: Email đã được sử dụng

  /api/v1/users/settings:
    get:
      tags:
        - Users
      summary: Lấy cài đặt người dùng
      description: Trả về cài đặt của người dùng
      operationId: getUserSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cài đặt người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserSettings'

    patch:
      tags:
        - Users
      summary: Cập nhật cài đặt
      description: Cập nhật cài đặt người dùng
      operationId: updateUserSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                theme:
                  type: string
                  enum:
                    - LIGHT
                    - DARK
                    - SYSTEM
                language:
                  type: string
                  enum:
                    - vi
                    - en
                fontSize:
                  type: number
                  minimum: 12
                  maximum: 24
                highContrast:
                  type: boolean
                speechSpeed:
                  type: number
                  minimum: 0.5
                  maximum: 2
                speechPitch:
                  type: number
                  minimum: 0.5
                  maximum: 2
                autoSpeak:
                  type: boolean
                avatarColor:
                  type: integer
                  minimum: 0
                  maximum: 3
                notificationsEnabled:
                  type: boolean
                studyReminder:
                  $ref: '#/components/schemas/StudyReminder'
                shareUsageData:
                  type: boolean
                notificationPreferences:
                  type: object
                  additionalProperties: false
                  properties:
                    newWords:
                      type: boolean
                    favorites:
                      type: boolean
                    updates:
                      type: boolean
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserSettings'

  /api/v1/learning/topics:
    get:
      tags: [Dictionary]
      summary: Explore topics with published word counts and unique enrolled learners
      operationId: exploreLearningTopics
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: Items and pagination, maximum 10 topics per page }
        '401': { description: Authentication required }
  /api/v1/learning/topics/{id}:
    get:
      tags: [Dictionary]
      summary: Read ten topic words with images, videos and personal progress
      operationId: getLearningTopic
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: stage, schema: { type: string, enum: [ALL, LEARNING, REMEMBERED, REVIEW] } }
      responses:
        '200': { description: Topic, enrolled flag, summary, items and pagination }
        '404': { description: Topic unavailable }
  /api/v1/learning/topics/{id}/start:
    post:
      tags: [Dictionary]
      summary: Start a topic once per account
      operationId: startLearningTopic
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Enrolled, including an already enrolled account }
        '409': { description: Topic contains no published words }
  /api/v1/learning/progress:
    get:
      tags: [Dictionary]
      summary: Personal learning totals and ten enrolled topics per page
      operationId: getLearningProgress
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: stage, schema: { type: string, enum: [ALL, LEARNING, REMEMBERED, REVIEW] } }
      responses:
        '200': { description: Summary of word stages, topic items and pagination }
  /api/v1/learning/words/{id}/progress:
    patch:
      tags: [Dictionary]
      summary: Explicit self assessment of a published word in an enrolled topic
      operationId: rateLearningWord
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stage]
              properties:
                stage: { type: string, enum: [LEARNING, REMEMBERED, REVIEW] }
      responses:
        '200': { description: Saved personal rating and next review time }
        '409': { description: Topic must be started first }
  /api/v1/learning/today:
    get:
      tags: [Dictionary]
      operationId: getLearningToday
      summary: Lightweight owner-scoped today's counters and saved goals for foreground polling
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Asia/Ho_Chi_Minh today with unique learned/newWords/reviewed counts, goals and nullable lastQuizAt; same rules as insights
        '400': { description: Query parameters are not supported }
        '401': { description: Authentication required }
  /api/v1/learning/activity:
    get:
      tags: [Dictionary]
      operationId: getLearningDayWords
      summary: Actual unique studied or reviewed words on a Vietnam calendar date
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: date, required: true, schema: { type: string, format: date } }
        - { in: query, name: kind, schema: { type: string, enum: [learned, reviewed], default: learned } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        '200':
          description: Owner-scoped date, kind, timeZone, pagination and at most ten unique words with entryId, word, topicName, occurredAt; learned includes stage/isNew, reviewed includes matched/attempts. No user IDs or camera captures.
        '400': { description: Invalid calendar date, kind, page or unknown query parameter }
        '401': { description: Authentication required }
  /api/v1/learning/insights:
    get:
      tags: [Dictionary]
      operationId: getLearningInsights
      summary: Vietnam-calendar activity, daily goals and paginated frequently missed camera-quiz words
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: days, schema: { type: integer, enum: [7, 30], default: 7 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        '200':
          description: Owner-scoped zero-filled daily word counts, goals and available weak words; no progress mutations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      timeZone: { type: string, enum: [Asia/Ho_Chi_Minh] }
                      days: { type: integer, enum: [7, 30] }
                      startDate: { type: string, format: date }
                      endDate: { type: string, format: date }
                      activity:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            learned: { type: integer, minimum: 0 }
                            newWords: { type: integer, minimum: 0 }
                            reviewed: { type: integer, minimum: 0 }
                      today: { type: object, description: Today's date and unique learned/newWords/reviewed counts }
                      goals: { type: object, description: Persisted newWords and reviewWords targets, defaults 5 and 10 }
                      lastQuizAt: { type: string, format: date-time, nullable: true }
                      weakWords:
                        type: object
                        properties:
                          pagination: { type: object }
                          items:
                            type: array
                            maxItems: 10
                            items:
                              type: object
                              properties:
                                entryId: { type: string }
                                topicId: { type: string }
                                word: { type: string }
                                topicName: { type: string }
                                misses: { type: integer }
                                attempts: { type: integer }
                                missRate: { type: integer, minimum: 0, maximum: 100 }
                                latestMatched: { type: boolean }
                                lastReviewedAt: { type: string, format: date-time }
        '400': { description: Invalid period/page or unknown query parameter }
        '401': { description: Authentication required }
  /api/v1/learning/goals:
    patch:
      tags: [Dictionary]
      operationId: updateLearningGoals
      summary: Persist the authenticated learner's daily new-word and review-word targets
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newWords, reviewWords]
              properties:
                newWords: { type: integer, minimum: 1, maximum: 100 }
                reviewWords: { type: integer, minimum: 1, maximum: 200 }
            example: { newWords: 5, reviewWords: 10 }
      responses:
        '200': { description: Saved newWords and reviewWords goals }
        '400': { description: Invalid targets or caller-supplied owner }
        '401': { description: Authentication required }
  /api/v1/learning/history:
    get:
      tags: [Dictionary]
      summary: Owned learning timeline including labeled last-state records from older progress
      operationId: getPersonalLearningHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: pageSize, schema: { type: integer, enum: [10, 20, 50], default: 10 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 80 } }
        - { in: query, name: entryId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200':
          description: Newest owned records with bounded page size, filtered before pagination; no userId in records
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      pagination: { type: object }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string, enum: [TOPIC_STARTED, SELF_RATED, QUIZ_REVIEWED, RECORDED_PROGRESS] }
                            word: { type: string }
                            topicName: { type: string }
                            entryId: { type: string, nullable: true }
                            createdAt: { type: string, format: date-time }
                            stage: { type: string, nullable: true, enum: [LEARNING, REMEMBERED, REVIEW, null] }
                            score: { type: number, nullable: true }
                            applied: { type: boolean }
        '400': { description: Invalid page, search, entryId or unsupported query parameter }
        '401': { description: Authentication required }
  /api/v1/learning/coach:
    post:
      tags: [Dictionary]
      summary: Advisory review plan using LM Studio, with a labeled offline fallback
      operationId: getLearningAdvice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                async: {type: boolean, enum: [true]}
                requestKey: {type: string, pattern: '^[a-f0-9]{32}$'}
            examples:
              synchronous: {value: {}}
              background: {value: {async: true, requestKey: '0123456789abcdef0123456789abcdef'}}
      responses:
        '200': { description: Source, advice and actual progress summary; never changes ratings }
        '202': { description: 'Private background job ID and state; async requires requestKey. Poll GET /learning/ai-jobs/{id}.' }
        '429': { description: Six advice requests per minute per account or background worker busy }
  /api/v1/learning/ai-jobs/{id}:
    get:
      tags: [Dictionary]
      summary: Poll a short-lived learning AI job belonging to the authenticated account
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: No-store pending, completed with result DTO, or failed with a sanitized message}
        '401': {description: Current valid account session required}
        '404': {description: Job expired, server restarted, or job belongs to another account}
  /api/v1/learning/analysis:
    post:
      tags: [Dictionary]
      summary: Analyze the authenticated learner's current personal progress across started topics
      operationId: analyzePersonalLearningProgress
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                async: {type: boolean, enum: [true]}
                requestKey: {type: string, pattern: '^[a-f0-9]{32}$'}
            example: {}
      responses:
        '202': {description: 'Private background job ID and state; async requires requestKey. Poll GET /learning/ai-jobs/{id}.'}
        '200':
          description: Read-only snapshot, topic summaries and a labeled AI or deterministic analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      source: { type: string, enum: [lm-studio, rules, no-data] }
                      generatedAt: { type: string, format: date-time }
                      analysis: { type: string }
                      summary:
                        type: object
                        properties:
                          total: { type: integer, minimum: 0 }
                          learning: { type: integer, minimum: 0 }
                          remembered: { type: integer, minimum: 0 }
                          review: { type: integer, minimum: 0 }
                          topicCount: { type: integer, minimum: 0 }
                          rememberedPercent: { type: integer, minimum: 0, maximum: 100 }
                      topics:
                        type: array
                        maxItems: 40
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            total: { type: integer }
                            learning: { type: integer }
                            remembered: { type: integer }
                            review: { type: integer }
                            rememberedPercent: { type: integer }
        '400': { description: Only an empty object or async flag with requestKey is accepted }
        '401': { description: Authentication required }
        '429': { description: Three analysis requests per minute per account }
  /api/v1/learning/topics/{id}/quiz:
    post:
      tags: [Dictionary]
      summary: Start or resume private recall practice; video-choice and camera clients remain supported
      operationId: startReviewQuiz
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                format: { type: string, enum: [CAMERA, VIDEO_CHOICE, VIDEO_RECALL, VIDEO_MATCH], default: CAMERA }
      responses:
        '200': { description: 'VIDEO_RECALL returns up to ten media questions and text drafts. VIDEO_MATCH returns media questions grouped by round and a shuffled matchOptions pool of opaque values without an answer mapping; first attempts and hints survive reloads. Pending recall or matching drafts are resumed without replacement. Empty legacy bodies retain camera behavior.' }
        '409': { description: Not enrolled, no due words, or insufficient available media and distinct distractors }
        '429': { description: Quiz request rate exceeded }
  /api/v1/learning/quizzes/{id}:
    get:
      tags: [Dictionary]
      summary: Restore an owned quiz draft or completed result
      operationId: getReviewQuiz
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Quiz kind, questions, media, saved selections and persisted result without draft answer keys }
        '404': { description: Quiz not found or owned by another account }
  /api/v1/learning/quizzes/{id}/answers:
    patch:
      tags: [Dictionary]
      summary: Save quiz answers before moving between questions or submitting
      operationId: saveReviewQuizAnswers
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, maxLength: 1000 }
      responses:
        '200': { description: 'Saved owned draft. Recall answers are text up to 200 characters; checked answers are immutable. Choice answers are opaque option values. Empty strings permit partial drafts.' }
        '400': { description: Invalid answer count, option from another question, unknown option or invalid payload }
        '404': { description: Quiz not found }
        '409': { description: Quiz completed or currently being graded }
  /api/v1/learning/quizzes/{id}/captures:
    patch:
      tags: [Dictionary]
      summary: Save the sign label recognized by the camera for one quiz word
      operationId: saveReviewQuizCapture
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entryId, recognizedLabel]
              properties:
                entryId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                recognizedLabel: { type: string, maxLength: 200 }
      responses:
        '200': { description: Saved recognized label for an owned draft quiz }
        '400': { description: Invalid word ID or word does not belong to quiz }
        '404': { description: Quiz not found }
        '409': { description: Quiz already completed }
  /api/v1/learning/quizzes/{id}/submit:
    post:
      tags: [Dictionary]
      summary: Save recall results or score legacy attempts and atomically update review progress
      operationId: submitReviewQuiz
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Source video-recall has summary independent/assisted/review. Only an exact approved word or alias checked without a hint becomes remembered; assisted and self-confirmed answers remain review. Changed progress is preserved. Legacy sources video-choice and sign-ai-camera remain valid. Repeated submits never duplicate events; AI never grades.' }
        '400': { description: Incomplete answers or unexpected client fields }
        '404': { description: Quiz not found }
        '409': { description: Quiz already being graded }
        '429': { description: Quiz request rate exceeded }
  /api/v1/learning/quizzes/{id}/advice:
    post:
      tags: [Dictionary]
      summary: Start private read-only LM Studio feedback for completed recall, matching or video-choice practice
      operationId: reviewQuizAdvice
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [async, requestKey]
              additionalProperties: false
              properties:
                async: { type: boolean, enum: [true] }
                requestKey: { type: string, pattern: '^[a-f0-9]{32}$' }
      responses:
        '202': { description: 'Owner-scoped background job; poll /learning/ai-jobs/{id}. Completed result has source lm-studio or rules and advice. Scores and progress never change.' }
        '400': { description: Invalid async request }
        '401': { description: Authentication required }
        '404': { description: Quiz not found or owned by another account }
        '409': { description: Quiz is not a completed recall, matching or video-choice attempt }
        '429': { description: Per-account request or concurrent AI job limit reached }
  /api/v1/learning/quizzes/{id}/match:
    post:
      tags: [Dictionary]
      summary: Check a matching-game pair and persist attempts without grading with AI
      operationId: saveReviewMatch
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entryId, optionId, requestId]
              properties:
                entryId: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
                optionId: {type: string, format: uuid}
                requestId: {type: string, format: uuid}
      responses:
        '200': {description: 'Owned game state. Repeating the same requestId and pair does not add an attempt. All pairs must match before submission; only first-try unassisted matches count toward quiz score. Game points are separate; matching does not promote words to remembered.'}
        '400': {description: Invalid payload, question or option from another round}
        '401': {description: Authentication required}
        '404': {description: Quiz not found or owned by another account}
        '409': {description: Request token conflict, locked pair, completed or incompatible quiz}
        '429': {description: Match rate or attempt limit exceeded; a correct pair remains accepted after the attempt limit}
  /api/v1/learning/quizzes/{id}/match-hint:
    post:
      tags: [Dictionary]
      summary: Reveal the matching card while persisting assisted status
      operationId: hintReviewMatch
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entryId]
              properties:
                entryId: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      responses:
        '200': {description: Owned game with hintOptionId and persisted usedHint; repeating a hint is idempotent}
        '400': {description: Invalid payload or question}
        '401': {description: Authentication required}
        '404': {description: Quiz not found or owned by another account}
        '409': {description: Completed or incompatible quiz}
        '429': {description: Hint rate exceeded}
  /api/v1/learning/quizzes/{id}/hint:
    post:
      tags: [Dictionary]
      summary: Reveal a bounded spelling hint and persist assisted-recall state
      operationId: hintReviewRecall
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId]
              additionalProperties: false
              properties:
                entryId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200': { description: Owned recall draft with persisted hint; repeated hints are idempotent }
        '400': { description: Invalid question or payload }
        '401': { description: Authentication required }
        '404': { description: Not owned or not found }
        '409': { description: Already checked, completed or not a recall draft }
  /api/v1/learning/quizzes/{id}/check:
    post:
      tags: [Dictionary]
      summary: Persist the first recall attempt and return its answer for comparison
      operationId: checkReviewRecall
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId, answer]
              additionalProperties: false
              properties:
                entryId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                answer: { type: string, maxLength: 200 }
                skip: { type: boolean, default: false }
      responses:
        '200': { description: 'EXACT/CLOSE/DIFFERENT/SKIPPED, server-recorded usedHint and approved answer. NFC, case, whitespace and outer punctuation normalize; accents are never removed to award a match. Exact retries are idempotent; no progress is changed until completion.' }
        '400': { description: Empty non-skipped answer or invalid question/payload }
        '401': { description: Authentication required }
        '404': { description: Not owned or not found }
        '409': { description: First checked answer changed, quiz completed or not recall }
  /api/v1/learning/quizzes/{id}/assessment:
    post:
      tags: [Dictionary]
      summary: Save explicit self-assessment for a checked non-exact recall answer
      operationId: assessReviewRecall
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId, assessment]
              additionalProperties: false
              properties:
                entryId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                assessment: { type: string, enum: [SAME_MEANING, REVIEW] }
      responses:
        '200': { description: 'Self-assessment saved separately from verified matches. SAME_MEANING never awards objective points or automatically marks remembered.' }
        '400': { description: Invalid question or assessment }
        '401': { description: Authentication required }
        '404': { description: Not owned or not found }
        '409': { description: Not a checked non-exact draft answer }
  /api/v1/learning/my-words:
    get:
      tags: [Dictionary]
      summary: List private words created by the authenticated learner
      operationId: getPersonalLearningWords
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: search, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: Maximum ten personal words and pagination }
    post:
      tags: [Dictionary]
      summary: Create a private word with meaning, example and optional media
      operationId: createPersonalLearningWord
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word, definition]
              additionalProperties: false
              properties:
                word: { type: string, minLength: 1, maxLength: 100 }
                definition: { type: string, minLength: 1, maxLength: 2000 }
                usageExample: { type: string, maxLength: 1000 }
                notes: { type: string, maxLength: 2000 }
                imageUrl: { type: string, maxLength: 1500000, description: HTTPS URL or base64 JPG/PNG/WebP }
                videoUrl: { type: string, maxLength: 2000, description: HTTPS video URL }
      responses:
        '201': { description: Created private word }
  /api/v1/learning/my-words/{id}:
    patch:
      tags: [Dictionary]
      summary: Update only an owned personal word
      operationId: updatePersonalLearningWord
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Partial private word fields accepted by create }
      responses:
        '200': { description: Updated private word }
        '404': { description: Word does not belong to this account or does not exist }
    delete:
      tags: [Dictionary]
      summary: Delete only an owned personal word
      operationId: deletePersonalLearningWord
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
        '404': { description: Word does not belong to this account or does not exist }

  # Staff
  /api/v1/staff/content:
    get:
      tags:
        - Staff
      summary: Lấy nội dung cần duyệt
      description: Danh sách nội dung cho nhân viên quản lý
      operationId: getContentForModeration
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ DRAFT, PENDING, PUBLISHED, REJECTED, ARCHIVED ]
        - name: category
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
        - name: order
          in: query
          schema:
            type: string
            enum: [ asc, desc ]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách nội dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DictionaryEntry'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
        '403':
          description: Không có quyền (yêu cầu STAFF hoặc ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/staff/content/{id}:
    get:
      tags:
        - Staff
      summary: Lấy chi tiết nội dung
      description: Chi tiết một nội dung cần duyệt
      operationId: getContentById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết nội dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'

    patch:
      tags:
        - Staff
      summary: Cập nhật nội dung
      description: Chỉnh sửa nội dung
      operationId: updateContent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                word:
                  type: string
                definition:
                  type: string
                videoUrl:
                  type: string
                thumbnailUrl:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'

  /api/v1/staff/content/{id}/approve:
    post:
      tags:
        - Staff
      summary: Phê duyệt nội dung
      description: Phê duyệt nội dung để xuất bản
      operationId: approveContent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Phê duyệt thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'
                  message:
                    type: string

  /api/v1/staff/content/{id}/reject:
    post:
      tags:
        - Staff
      summary: Từ chối nội dung
      description: Từ chối nội dung với lý do
      operationId: rejectContent
      security:
        - bearerAuth: []
      parameters:
