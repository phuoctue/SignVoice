openapi: 3.0.3
info:
  title: SignVoice REST API
  version: 1.0.0
  description: |
    REST API phục vụ ứng dụng SignVoice Flutter Android và Flutter Web.

    ## Xác thực (Authentication)

    API sử dụng JWT Bearer token cho xác thực:
    1. Đăng ký/đăng nhập để nhận access token và refresh token
    2. Thêm header `Authorization: Bearer {accessToken}` vào các request yêu cầu xác thực
    3. Khi access token hết hạn (401), dùng refresh token để nhận cặp token mới; token cũ bị thu hồi
    4. Web có thể refresh bằng cookie signvoice_refresh (HttpOnly, SameSite=Strict) và Origin được cho phép

    ## Vai trò (Roles)

    - **USER**: Người dùng thông thường (xem từ điển, lưu yêu thích, lịch sử)
    - **STAFF**: Nhân viên quản lý nội dung (tạo và chỉnh sửa bản nháp)
    - **ADMIN**: Quản trị viên hệ thống (quản lý người dùng, phê duyệt cuối cùng)

    Role tùy chỉnh lưu trong collection roles và được gán bằng customRoleId. API lấy permissions từ database ở mỗi request. ADMIN là alias để tương thích JWT; custom role chỉ được cấp bộ quyền đã chọn, không tự kế thừa quyền ADMIN. Không thể cấp hoặc quản lý quyền cao hơn quyền của người gọi.

    ## Chế độ Guest

    Người dùng có thể tạo tài khoản guest tạm thời mà không cần email/password.
    Guest có thể chuyển đổi thành tài khoản vĩnh viễn sau này.
    Khách được xem kho công khai và một phiên thử 10 phút, tự động bắt đầu khi POST /api/v1/auth/guest thành công sau xác nhận dùng thử.
    Máy chủ giữ hạn dùng qua refresh token và các lần vào Khách trên cùng định danh bản cài đặt.
    Lưu hội thoại/yêu thích, bộ sưu tập riêng và đồng bộ cá nhân yêu cầu tài khoản chính thức.
    Hết hạn chặn cả học tập/đang học/quiz; chỉ còn đọc từ điển và xem trước chủ đề công khai.

    ## Giới hạn

    - **AI Recognition**: Gateway /sign-ai chuyển tiếp tới service AI riêng; inference yêu cầu xác thực và phiên thử còn hạn với khách. WebSocket dùng ticket ngắn hạn từ /api/v1/guest-trial/ai-ticket.
    - **OAuth**: Google/Facebook web authorization-code login; provider flags are disabled until server credentials/origins are configured. See docs/active/OAUTH_SETUP.md.
    - **Email**: Xác thực email chưa được kích hoạt

  contact:
    name: SignVoice Team
    email: support@signvoice.example.com

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: /
    description: Same-origin server

tags:
  - name: System
    description: Kiểm tra sức khỏe hệ thống
  - name: Authentication
    description: Đăng ký, đăng nhập, quản lý phiên làm việc
  - name: Dictionary
    description: Quản lý từ điển ngôn ngữ ký hiệu
  - name: Categories
    description: Danh mục từ vựng
  - name: Favorites
    description: Danh sách yêu thích của người dùng
  - name: History
    description: Lịch sử tra cứu
  - name: Users
    description: Quản lý hồ sơ và cài đặt người dùng
  - name: Staff
    description: Công cụ quản lý nội dung cho nhân viên
  - name: Admin
    description: Quản trị hệ thống

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token nhận được từ endpoint đăng nhập

  schemas:
    CollectionPersonalWord:
      type: object
      additionalProperties: false
      required: [word, definition]
      properties:
        word: {type: string, minLength: 1, maxLength: 100}
        definition: {type: string, minLength: 1, maxLength: 2000}
        usageExample: {type: string, maxLength: 1000, default: ''}
        notes: {type: string, maxLength: 2000, default: ''}
        imageUrl: {type: string, maxLength: 1500000, default: '', description: 'HTTPS image URL or JPEG/PNG/WebP base64 data URL'}
        videoUrl: {type: string, maxLength: 2000, default: '', description: 'HTTPS URL or empty'}
    GuestTrialStatus:
      type: object
      required: [state, serverNow, durationSeconds, remainingSeconds]
      properties:
        state:
          type: string
          enum: [available, active, expired, unlimited]
        serverNow:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          enum: [600]
        remainingSeconds:
          type: integer
          nullable: true
          minimum: 0
    TokenPair:
      type: object
      required: [ accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt ]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time

    AuthUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            [
              id,
              displayName,
              role,
              accountType,
              status,
              isGuest,
              createdAt,
              updatedAt
            ]
          properties:
            id:
              type: string
            isGuest:
              type: boolean
      properties:
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        customRoleName:
          type: string

    AuthData:
      type: object
      required: [ user, tokens ]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    RegistrationData:
      type: object
      required: [user, loginRequired]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        loginRequired:
          type: boolean
          enum: [true]
      description: Account created without tokens or an authenticated session. Sign in separately.

    User:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        email:
          type: string
          format: email
          example: "user@example.com"
        displayName:
          type: string
          example: "Nguyễn Văn A"
        role:
          type: string
          enum: [ USER, STAFF, ADMIN ]
          example: "USER"
        status:
          type: string
          enum: [ ACTIVE, SUSPENDED, DELETED ]
          example: "ACTIVE"
        accountType:
          type: string
          enum: [ LOCAL, GOOGLE, FACEBOOK, GUEST ]
          example: "LOCAL"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.jpg"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        customRoleName:
          type: string

    DictionaryEntry:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        word:
          type: string
          example: "Xin chào"
        definition:
          type: string
          example: "Lời chào hỏi khi gặp gỡ"
        videoUrl:
          type: string
          example: "https://example.com/videos/xin-chao.mp4"
        thumbnailUrl:
          type: string
          nullable: true
          example: "https://example.com/thumbs/xin-chao.jpg"
        categoryId:
          type: string
          example: "507f1f77bcf86cd799439011"
        imageUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
          example: [ "chào hỏi", "giao tiếp" ]
        difficulty:
          type: string
          enum: [ BASIC, INTERMEDIATE, ADVANCED ]
          example: "BASIC"
        usageExample:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [ DRAFT, PENDING, PUBLISHED, REJECTED, ARCHIVED ]
          example: "PUBLISHED"
        viewCount:
          type: integer
          example: 150
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: "Chào hỏi"
        slug:
          type: string
          example: "chao-hoi"
        description:
          type: string
          example: "Các từ vựng về lời chào hỏi"
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
          example: 1
        wordCount:
          type: integer
          example: 25
        parentId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ ACTIVE, INACTIVE ]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Favorite:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        entryId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/DictionaryEntry'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    SearchHistory:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        entryId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/DictionaryEntry'
        viewedAt:
          type: string
          format: date-time
        viewDuration:
          type: integer
          nullable: true

    StudyReminder:
      type: object
      additionalProperties: false
      required: [enabled, hour, minute, weekdays, timezone]
      properties:
        enabled:
          type: boolean
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: Monday=1, Sunday=7
        timezone:
          type: string
          maxLength: 100
          example: Asia/Ho_Chi_Minh
    UserSettings:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        theme:
          type: string
          enum:
            - LIGHT
            - DARK
            - SYSTEM
        language:
          type: string
          enum:
            - vi
            - en
        fontSize:
          type: number
          minimum: 12
          maximum: 24
        highContrast:
          type: boolean
        speechSpeed:
          type: number
          minimum: 0.5
          maximum: 2
        speechPitch:
          type: number
          minimum: 0.5
          maximum: 2
        autoSpeak:
          type: boolean
        avatarColor:
          type: integer
          minimum: 0
          maximum: 3
        notificationsEnabled:
          type: boolean
        studyReminder:
          $ref: '#/components/schemas/StudyReminder'
        shareUsageData:
          type: boolean
        notificationPreferences:
          type: object
          additionalProperties: false
          properties:
            newWords:
              type: boolean
            favorites:
              type: boolean
            updates:
              type: boolean

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "AUTH_TOKEN_EXPIRED"
            message:
              type: string
              example: "Token has expired"
            details:
              type: object
        requestId:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 8

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Validation failed"
            details:
              type: object
              properties:
                field:
                  type: string
                  example: "email"
                message:
                  type: string
                  example: "Invalid email format"
    AdminRoleInput:
      type: object
      additionalProperties: false
      required:
        - name
        - key
        - permissions
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        key:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: Mã duy nhất; không dùng USER, STAFF hoặc ADMIN.
        description:
          type: string
          maxLength: 500
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
          uniqueItems: true
    AdminRoleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        key:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: Mã duy nhất; không dùng USER, STAFF hoặc ADMIN.
        description:
          type: string
          maxLength: 500
        permissions:
          type: array
          items:
            type: string
            enum:
              - admin:access
              - staff:access
              - users:read
              - users:write
              - roles:read
              - roles:write
              - dictionary:read
              - dictionary:write
              - content:publish
              - categories:read
              - categories:write
              - sessions:read
              - sessions:write
          uniqueItems: true
      minProperties: 1
    AdminUserInput:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - password
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Có chữ và số.
        role:
          type: string
          enum:
            - USER
            - STAFF
            - ADMIN
          default: USER
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
    AdminUserUpdate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        role:
          type: string
          enum:
            - USER
            - STAFF
            - ADMIN
        customRoleId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DELETED
      minProperties: 1
    AdminDictionaryInput:
      type: object
      additionalProperties: false
      required:
        - word
        - definition
        - videoUrl
        - categoryId
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          type: string
          minLength: 5
          maxLength: 2000
        videoUrl:
          type: string
          format: uri
          pattern: ^https?://
        thumbnailUrl:
          type: string
        imageUrls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        categoryId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        difficulty:
          type: string
          enum:
            - BEGINNER
            - INTERMEDIATE
            - ADVANCED
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        usageExample:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 1000
    AdminDictionaryUpdate:
      type: object
      additionalProperties: false
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 200
        definition:
          type: string
          minLength: 5
          maxLength: 2000
        videoUrl:
          type: string
          format: uri
          pattern: ^https?://
        thumbnailUrl:
          type: string
        imageUrls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        categoryId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        difficulty:
          type: string
          enum:
            - BEGINNER
            - INTERMEDIATE
            - ADVANCED
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        usageExample:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 1000
      minProperties: 1
    AdminCategoryInput:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 80
        description:
          type: string
          maxLength: 500
        icon:
          type: string
          maxLength: 50
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
    AdminCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 80
        description:
          type: string
          maxLength: 500
        icon:
          type: string
          maxLength: 50
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
      minProperties: 1
    Conversation:
      type: object
      properties:
        _id:
          type: string
        content:
          type: string
          minLength: 1
          maxLength: 10000
        direction:
          type: string
          enum:
            - TEXT
            - SIGN_TO_SPEECH
            - SPEECH_TO_TEXT
          default: TEXT
        favorite:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /api/v1/admin/collections:
    get:
      tags: [Admin]
      summary: List public or explicitly reported collection snapshots
      description: Requires management access and collections:read. Never enumerates unreported private/unlisted sets. Returns 10 public snapshots with canonical word counts and batched open-report counts. No owner/reporter identity, private words, notes, progress or share token.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {in: query, name: search, schema: {type: string, maxLength: 80}}
        - {in: query, name: status, schema: {type: string, enum: [ALL, CLEAR, HIDDEN, BLOCKED, REPORTED, REVIEW_REQUESTED], default: ALL}}
      responses:
        '200': {description: 'data.items and data.pagination; names and avatars come from submitted public snapshots'}
        '400': {description: Invalid filters}
        '401': {description: Authentication required}
        '403': {description: Missing management or collection read permission}
  /api/v1/admin/collections/{id}:
    get:
      tags: [Admin]
      summary: Preview a submitted snapshot and its current published dictionary references
      description: Requires collections:read. At most 10 canonical words per page. Private changes after withdrawal remain invisible until explicit owner resubmission or a recipient report of the shared content.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
      responses:
        '200': {description: 'data.collection includes moderationState, moderationVersion, reason and snapshot time; data.items contain only published dictionary entries'}
        '401': {description: Authentication required}
        '403': {description: Missing read permission}
        '404': {description: No submitted snapshot available}
  /api/v1/admin/collections/{id}/moderation:
    post:
      tags: [Admin]
      summary: Hide, block or restore sharing with an audited reason
      description: Requires collections:read and collections:moderate. HIDDEN excludes discovery but keeps capability links; BLOCKED also blocks preview and new imports. CLEAR respects the owner's present sharing choice. State and AuditLog commit atomically. Restoration of changed shared content requires an updated submission; existing independent copies and original private data remain intact.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, reason, version]
              properties:
                state: {type: string, enum: [CLEAR, HIDDEN, BLOCKED]}
                reason: {type: string, minLength: 5, maxLength: 1000}
                version: {type: integer, minimum: 0}
      responses:
        '200': {description: New moderation metadata}
        '400': {description: Invalid reason or input}
        '401': {description: Authentication required}
        '403': {description: Missing moderation permission}
        '404': {description: No submitted snapshot}
        '409': {description: Stale version, unchanged state or changed content awaiting resubmission}
  /api/v1/admin/collections/{id}/reports:
    get:
      tags: [Admin]
      summary: Read paged reports without reporter identity
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {in: query, name: status, schema: {type: string, enum: [ALL, OPEN, RESOLVED, DISMISSED], default: OPEN}}
      responses:
        '200': {description: '10 reports per page; category, details, resolution, status and timestamps only'}
        '401': {description: Authentication required}
        '403': {description: Missing collection read permission}
        '404': {description: No submitted snapshot}
  /api/v1/admin/collections/{id}/reports/{reportId}/resolve:
    post:
      tags: [Admin]
      summary: Resolve or dismiss an open report with an audited reason
      description: Requires collections:moderate and collections:read. Does not implicitly change sharing state. Rejects already handled reports and writes AuditLog in the same transaction.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: path, name: reportId, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: {type: string, enum: [RESOLVED, DISMISSED]}
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '200': {description: Report resolved}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Missing moderation permission}
        '404': {description: No submitted snapshot}
        '409': {description: Report already handled or unavailable}
  /api/v1/admin/collections/{id}/history:
    get:
      tags: [Admin]
      summary: Read paged immutable collection moderation history
      description: Requires collections:read. Shows action-time moderator name/role, action, reason and timestamp. Owner resubmissions are labelled as owner without revealing account identity. AuditLog uses its existing one-year retention policy.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
      responses:
        '200': {description: 10 history events per page}
        '401': {description: Authentication required}
        '403': {description: Missing collection read permission}
        '404': {description: No submitted snapshot}
  /api/v1/shared-collections/{code}/reports:
    post:
      tags: [Dictionary]
      summary: Report a currently accessible shared collection
      description: Permanent account required; 10 requests/hour/account. One open report per collection and reporter, duplicate submission is idempotent. Self-reporting and invalid/revoked/blocked capability codes are rejected. Reports do not automatically block collections. The submitted shared snapshot becomes available to moderators, never the owner's private words or notes.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: code, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category]
              properties:
                category: {type: string, enum: [INAPPROPRIATE, MISLEADING, SPAM, COPYRIGHT, OTHER]}
                details: {type: string, maxLength: 1000, default: '', description: At least 5 characters when category is OTHER}
      responses:
        '200': {description: 'data.received and data.alreadyReported, without report/account IDs'}
        '400': {description: Invalid input or self-report}
        '401': {description: Authentication required}
        '403': {description: Permanent account required}
        '404': {description: Shared content unavailable}
        '429': {description: Too many reports}
  /api/v1/sign-collections/{id}/moderation-review:
    post:
      tags: [Dictionary]
      summary: Owner explicitly resubmits updated shared fields for moderation
      description: Permanent owner account required. Captures current name, avatar, description and dictionary reference IDs; never private words/notes/progress. Does not unblock or publish the collection. Later metadata or entry edits invalidate the pending submission so the owner can submit the next version.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Review requested}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Permanent account required}
        '404': {description: Collection not owned by caller}
        '409': {description: Already pending or no restriction to review}
  /api/v1/sign-collections/{id}/personal-words/available:
    get:
      tags: [Dictionary]
      summary: List the owner's preserved private words not assigned to a collection
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {in: query, name: search, schema: {type: string, maxLength: 80}}
      responses:
        '200': {description: '10 words/page, without photos; owned collection required'}
        '401': {description: Authentication required}
        '404': {description: Collection not owned by the caller}
  /api/v1/sign-collections/{id}/personal-words/attach:
    post:
      tags: [Dictionary]
      summary: Attach existing private words without copying or deleting their content
      description: Owner-only atomic batch. Repeating a successful request is idempotent. Words assigned to another collection are rejected. Combined limit is 200 library and private words.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [wordIds]
              properties:
                wordIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      responses:
        '200': {description: Attached atomically}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '404': {description: Collection or words unavailable to caller}
        '409': {description: Combined collection size exceeds 200}
  /api/v1/sign-collections/{id}/personal-words:
    post:
      tags: [Dictionary]
      summary: Create a private word inside an owned collection
      description: Private words never appear in public previews, discovery, imports or library quizzes.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionPersonalWord'}
      responses:
        '201': {description: Private word created}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '404': {description: Collection not owned by caller}
        '409': {description: Combined collection size exceeds 200}
  /api/v1/sign-collections/{id}/personal-words/{wordId}:
    get:
      tags: [Dictionary]
      summary: Read a private word including its full photo for viewing or editing
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: path, name: wordId, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      responses:
        '200': {description: 'Owned word, including imageUrl; never publicly cached'}
        '401': {description: Authentication required}
        '404': {description: Word or collection not owned by caller}
    patch:
      tags: [Dictionary]
      summary: Replace editable fields of an owned collection private word
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: path, name: wordId, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionPersonalWord'}
      responses:
        '200': {description: Saved; supplied fields replace previous values}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '404': {description: Word or collection not owned by caller}
    delete:
      tags: [Dictionary]
      summary: Permanently delete a private word owned by the caller
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
        - {in: path, name: wordId, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      responses:
        '200': {description: Deleted}
        '401': {description: Authentication required}
        '404': {description: Word or collection not owned by caller}
  /api/v1/shared-collections:
    get:
      tags: [Dictionary]
      summary: Khám phá bộ sưu tập được chủ bộ đăng công khai
      description: Không cần đăng nhập. Tối đa 10 bộ mỗi trang; chỉ bộ chủ động bật discoverable của tài khoản chính thức đang hoạt động. Không trả thông tin tác giả, ghi chú hoặc tiến độ. Media được lấy lại từ từ điển chuẩn theo lô; bộ có media vừa bị gỡ có thể tạm có wordCount bằng 0.
      security: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - in: query
          name: search
          schema: {type: string, maxLength: 80, default: ''}
      responses:
        '200': {description: data.items chứa tên/mô tả/wordCount/thumbnailUrl/shareCode và pagination}
        '400': {description: Truy vấn không hợp lệ}
        '429': {description: Giới hạn 60 yêu cầu/phút}
  /api/v1/sign-collections/{id}/discovery:
    post:
      tags: [Dictionary]
      summary: Đăng hoặc gỡ bộ khỏi khám phá công khai
      description: Chỉ chủ bộ có tài khoản chính thức. Bật cần ít nhất một từ công khai, tạo mã chia sẻ nếu chưa có. Tắt chỉ gỡ khỏi danh sách, giữ liên kết cũ. Tắt toàn bộ chia sẻ tại /share thu hồi cả mã và khám phá. Bộ nhập từ người khác luôn riêng tư mặc định.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: data chứa trạng thái discoverable và shareCode của chủ bộ}
        '400': {description: Dữ liệu không hợp lệ}
        '401': {description: Chưa đăng nhập}
        '403': {description: Tài khoản khách không được đăng công khai}
        '404': {description: Bộ không tồn tại hoặc không thuộc tài khoản}
        '409': {description: Chưa có từ công khai trong bộ}
        '429': {description: Thay đổi quá nhanh}
  /api/v1/sign-collections:
    get:
      tags: [Dictionary]
      summary: Danh sách bộ sưu tập riêng
      description: Tối đa 10 bộ mỗi trang; tổng hợp từ và tiến độ theo lô. Tối đa 100 bộ mỗi tài khoản.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - in: query
          name: search
          schema: {type: string, maxLength: 80, default: ''}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
    post:
      tags: [Dictionary]
      summary: Tạo bộ sưu tập riêng
      description: Từ thư viện dùng tham chiếu trực tiếp; bộ có thể chứa từ riêng và ảnh đại diện thu nhỏ.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                description: {type: string, maxLength: 500, default: ""}
                avatarImage: {type: string, maxLength: 100000, description: 'JPEG/PNG/WebP base64 data URL, tối đa 72 KiB; chuỗi rỗng để bỏ ảnh'}
      responses:
        '201': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/import:
    post:
      tags: [Dictionary]
      summary: Nhập bộ được chia sẻ
      description: Tạo bản độc lập gồm ảnh đại diện bộ và từ thư viện; nhập lặp trả lại bộ đã lưu. Không sao chép từ riêng, ghi chú hoặc tiến độ.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, pattern: '^[a-f0-9]{32}$'}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/{id}:
    get:
      tags: [Dictionary]
      summary: Nội dung bộ sưu tập riêng
      description: Tối đa 10 từ thư viện khả dụng hoặc từ riêng mỗi trang. isPersonal và stage PRIVATE phân biệt từ riêng; summary.personal không tính vào tiến độ thư viện. Ảnh từ riêng trên 100000 ký tự được bỏ khỏi trang với imageDeferred true; GET personal-words/{wordId} lấy ảnh đầy đủ khi mở/sửa.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - in: query
          name: search
          schema: {type: string, maxLength: 80, default: ''}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
    patch:
      tags: [Dictionary]
      summary: Đổi tên, mô tả và ảnh đại diện bộ
      description: Chỉ chủ bộ được sửa. Không gửi avatarImage thì giữ ảnh hiện có; chuỗi rỗng để bỏ ảnh.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                description: {type: string, maxLength: 500, default: ""}
                avatarImage: {type: string, maxLength: 100000, description: 'JPEG/PNG/WebP base64 data URL, tối đa 72 KiB'}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
    delete:
      tags: [Dictionary]
      summary: Xóa bộ sưu tập
      description: Giữ từ điển, ghi chú và tiến độ; kết thúc bài ôn dở. Từ riêng được bỏ collectionId, vẫn giữ nội dung/ảnh và có thể thêm vào bộ khác.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/{id}/candidates:
    get:
      tags: [Dictionary]
      summary: Chọn từ công khai cho bộ
      description: Tối đa 10 từ mỗi trang; inCollection cho biết từ đã có trong bộ.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - in: query
          name: search
          schema: {type: string, maxLength: 80, default: ''}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/{id}/entries:
    post:
      tags: [Dictionary]
      summary: Thêm nhiều từ vào bộ
      description: Thêm lặp không tạo trùng. Mỗi bộ tối đa 200 từ; 409 khi có từ không còn khả dụng.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entryIds]
              properties:
                entryIds: {type: array, minItems: 1, maxItems: 200, items: {type: string, pattern: '^[a-fA-F0-9]{24}$'}}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/{id}/entries/{entryId}:
    delete:
      tags: [Dictionary]
      summary: Gỡ từ khỏi bộ
      description: Không xóa ghi chú hoặc tiến độ dùng chung của từ.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
        - in: path
          name: entryId
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/{id}/quiz:
    post:
      tags: [Dictionary]
      summary: Bắt đầu hoặc tiếp tục quiz của bộ
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                format: {type: string, enum: [VIDEO_RECALL, VIDEO_MATCH], default: VIDEO_RECALL}
      description: VIDEO_RECALL hoặc VIDEO_MATCH tối đa 10 từ, đa chủ đề. Lượt dở luôn được tiếp tục theo kiểu đã lưu. Ghép cặp cần ít nhất 2 mẫu khác nghĩa; không tự chuyển tiến độ sang đã nhớ. collectionId thay topicId ở phạm vi bài.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-collections/{id}/share:
    post:
      tags: [Dictionary]
      summary: Bật hoặc thu hồi mã chia sẻ
      description: Mã ngẫu nhiên 128 bit. Tắt mã có hiệu lực ngay; bản người nhận đã nhập vẫn độc lập.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/shared-collections/{code}:
    get:
      tags: [Dictionary]
      summary: Xem trước bộ được chia sẻ
      description: Không cần đăng nhập. Chỉ từ công khai; không trả owner, email, ghi chú hoặc tiến độ. 60 yêu cầu/phút.
      security: []
      parameters:
        - in: path
          name: code
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{32}$'}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - in: query
          name: search
          schema: {type: string, maxLength: 80, default: ''}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/sign-notes/{id}:
    get:
      tags: [Dictionary]
      summary: Đọc ghi chú riêng của một từ
      description: id là ID từ điển; chỉ trả ghi chú của người gọi.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
    put:
      tags: [Dictionary]
      summary: Lưu hoặc xóa ghi chú riêng
      description: Chuỗi rỗng xóa ghi chú. Không đưa ghi chú vào mã chia sẻ.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, maxLength: 2000}
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '401': {description: Yêu cầu đăng nhập}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/library/version:
    get:
      tags: [Dictionary]
      summary: Phiên bản thư viện media
      description: Trả data.revision và updatedAt. Client kiểm tra lúc mở, quay lại ứng dụng và mỗi 60 giây foreground; không đổi phiên đăng nhập.
      security: []
      responses:
        '200': {description: Thành công; dữ liệu trong data}
        '400': {description: Đầu vào không hợp lệ}
        '404': {description: Không có dữ liệu hoặc không thuộc tài khoản}
        '409': {description: Giới hạn hoặc dữ liệu đã thay đổi}
  /api/v1/auth/google/native/challenge:
    post:
      tags: [Authentication]
      summary: Issue five-minute one-use Android Google challenge
      responses:
        '200':
          description: No-store public Web client ID, nonce and opaque challenge; never a client secret
        '429': {description: Too many requests}
        '503': {description: Google Web client ID unavailable}
  /api/v1/auth/google/native/login:
    post:
      tags: [Authentication]
      summary: Verify Android Google ID token and create persisted SignVoice sessions
      description: Validates signature, Web audience, issuer, expiry, server nonce and verified email. Matching local email requires explicit authenticated linking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, idToken]
              properties:
                challenge: {type: string, pattern: '^[\w-]{43}$'}
                idToken: {type: string, minLength: 1, maxLength: 16384}
      responses:
        '200': {description: Standard authentication response with user and application tokens}
        '400': {description: Malformed, expired or consumed challenge}
        '401': {description: Google identity invalid}
        '403': {description: Account disabled}
        '409': {description: Matching email requires authenticated linking}
        '429': {description: Too many requests}
  /api/v1/auth/google/native/link:
    post:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Link a verified same-email Google identity to the current LOCAL account
      description: Preserves account ID, password, role and learning data. Does not accept account IDs or roles from the client. Invalid provider proof does not revoke the current app session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, idToken]
              properties:
                challenge: {type: string, pattern: '^[\w-]{43}$'}
                idToken: {type: string, minLength: 1, maxLength: 16384}
      responses:
        '200': {description: Safe user DTO with googleLinked and current authorization}
        '400': {description: Invalid proof, expired challenge, wrong email or ineligible account}
        '401': {description: SignVoice session required}
        '409': {description: Identity already linked or account changed concurrently}
        '429': {description: Too many requests}
  /api/v1/auth/oauth/providers:
    get:
      tags: [ Authentication ]
      summary: Public provider availability only (no credentials)
      responses:
        '200':
          description: Enabled flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [ google, facebook ]
                    additionalProperties: false
                    properties:
                      google: { type: boolean }
                      facebook: { type: boolean }
  /api/v1/auth/oauth/{provider}/start:
    get:
      tags: [ Authentication ]
      summary: Begin browser authorization-code login with HttpOnly SameSite=Lax state
        cookie
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [ google, facebook ] }
      responses:
        '302':
          {
            description: Redirect to configured provider; Google includes nonce and PKCE
              S256
          }
        '404': { description: Unknown provider }
        '429': { description: Too many requests }
        '503':
          {
            description: OAUTH_DISABLED or OAUTH_CONFIGURATION_INVALID; email and guest
              unaffected
          }
  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [ Authentication ]
      summary: Fixed Google/Facebook callback; atomically consume browser-bound state
        and verify identity server-side
      description: >-
        Concrete registered callbacks are /api/v1/auth/oauth/google/callback and
        /api/v1/auth/oauth/facebook/callback. Creates normal persisted JWT
        sessions, sets HttpOnly refresh cookie, and redirects only to configured
        frontend /#/oauth-complete. Redirects carry no tokens, only an
        allowlisted error code on failure.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [ google, facebook ] }
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        '303': { description: Success or sanitized OAuth error to configured frontend }
        '503': { description: Provider configuration unavailable }
  /api/v1/auth/oauth/complete:
    post:
      tags: [ Authentication ]
      summary: Bootstrap browser session from HttpOnly cookie after callback without
        prior local login metadata
      description: Requires exact configured frontend Origin and CORS allowlist;
        rotates and consumes the refresh session. Response uses normal user and
        tokens DTO; browser stores access only in memory and metadata locally.
      responses:
        '200': { description: Standard authentication response containing user and tokens }
        '401': { description: Missing, expired, revoked or replayed session }
        '403': { description: Untrusted or missing Origin }
  /api/v1/auth/change-password:
    post:
      tags: [ Authentication ]
      security: [ { bearerAuth: [] } ]
      summary: Change local password and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ currentPassword, newPassword ]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Password changed; cookie cleared; sign in again }
        '400':
          {
            description: Wrong current password,
            weak password,
            or guest/social account has no local password; valid session is preserved for retry
          }
        '401': { description: Missing or invalid bearer session }
        '422': { description: Unchanged new password }
  /api/v1/auth/set-password:
    post:
      tags: [ Authentication ]
      security: [ { bearerAuth: [] } ]
      summary: Add an email password to the currently signed-in Google account
      description: Requires a Google-only account and a login family created within 10 minutes. Preserves the Google identity and user data; revokes all sessions after setting the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ newPassword ]
              properties:
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Password created; sign in again with Google or email/password }
        '400': { description: Invalid password or account is not Google-only }
        '401': { description: Missing or invalid bearer session }
        '403': { description: Account disabled or fresh Google sign-in required }
        '409': { description: Account changed concurrently }
  /.well-known/assetlinks.json:
    get:
      tags: [ System ]
      summary: Android App Links signing association
      responses:
        '200': { description: Explicit package and SHA-256 signing fingerprints }
        '404': { description: App Links signing association not configured }
  /auth/reset-password:
    get:
      tags: [ Authentication ]
      summary: Open the Android reset screen or continue to the Web form
      description: Reset token is accepted only in the client-side fragment and is never read by this HTTP endpoint.
      responses:
        '200': { description: No-store native/Web reset handoff page }
  # System Health
  /health/live:
    get:
      tags:
        - System
      summary: Kiểm tra server đang chạy
      description: Endpoint đơn giản kiểm tra server có đang hoạt động hay không
      operationId: healthLive
      responses:
        '200':
          description: Server đang chạy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ok"
                      timestamp:
                        type: string
                        format: date-time
                      uptime:
                        type: number
                        example: 12345.67

  /health/ready:
    get:
      tags:
        - System
      summary: Kiểm tra server sẵn sàng phục vụ
      description: Kiểm tra server và database đã kết nối và sẵn sàng
      operationId: healthReady
      responses:
        '200':
          description: Server và database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ready"
                      timestamp:
                        type: string
                        format: date-time
                      database:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          name:
                            type: string
        '503':
          description: Database chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Authentication
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản mới
      description: Tạo tài khoản email. Web/mobile mới gửi requireLogin=true để không cấp phiên đăng nhập; client cũ vẫn được hỗ trợ khi không gửi cờ này.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Password123!"
                displayName:
                  type: string
                  example: "Nguyễn Văn A"
                requireLogin:
                  type: boolean
                  description: Gửi true để tạo tài khoản và yêu cầu đăng nhập riêng, không trả tokens.
      responses:
        '201':
          description: Đăng ký thành công; requireLogin=true trả RegistrationData, nếu không trả AuthData tương thích client cũ.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthData'
                      - $ref: '#/components/schemas/RegistrationData'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Đăng nhập bằng email và password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthData'
        '401':
          description: Email hoặc password không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/guest:
    post:
      tags:
        - Authentication
      summary: Tạo tài khoản guest
      description: Tạo tài khoản guest tạm thời không cần email/password
      operationId: createGuest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                newGuest:
                  type: boolean
                  description: Tạo tài khoản khách với hạn mức 10 phút mới; khôi phục phiên cũ vẫn giữ thời hạn đã cấp.
                deviceKey:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  description: Mã ngẫu nhiên bền vững của bản cài đặt native; trình duyệt còn dùng cookie HttpOnly signvoice_guest_device.
      responses:
        '201':
          description: Tài khoản guest được tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthData'
  /api/v1/auth/convert-guest:
    post:
      tags:
        - Authentication
      summary: Chuyển đổi tài khoản guest thành vĩnh viễn
      description: Thêm email/password, giữ dữ liệu guest. requireLogin=true thu hồi phiên guest và yêu cầu đăng nhập riêng; không cấp phiên mới.
      operationId: convertGuest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 50
                requireLogin:
                  type: boolean
                  description: Gửi true để thu hồi phiên guest và yêu cầu đăng nhập bằng tài khoản vừa tạo.
      responses:
        '200':
          description: Chuyển đổi thành công; requireLogin=true trả RegistrationData, nếu không trả AuthData tương thích client cũ.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthData'
                      - $ref: '#/components/schemas/RegistrationData'
        '400':
          description: Không phải tài khoản guest hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Làm mới access token
      description: Sử dụng refresh token để lấy access token mới
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token không hợp lệ hoặc hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      tags: [ Auth ]
      summary: Yêu cầu email đặt lại mật khẩu
      description: Không tiết lộ email có tồn tại. SMTP phải được cấu hình. Giới hạn
        mỗi tài khoản một yêu cầu trong 60 giây; liên kết có hiệu lực 15 phút.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Đã xử lý yêu cầu; phản hồi chung cho mọi địa chỉ email
        '400':
          description: Email không hợp lệ
        '429':
          description: Quá nhiều yêu cầu
        '503':
          description: Chưa cấu hình SMTP

  /api/v1/auth/reset-password:
    post:
      tags: [ Auth ]
      summary: Đặt mật khẩu mới bằng token nhận trong email
      description: Token dùng một lần. Mật khẩu mới 8–128 ký tự, có chữ cái và chữ số.
        Thu hồi mọi phiên đăng nhập cũ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, newPassword ]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Đã đặt lại mật khẩu, xóa refresh cookie; cần đăng nhập lại
        '400':
          description: Mật khẩu không hợp lệ hoặc token sai, hết hạn, đã dùng
        '429':
          description: Quá nhiều yêu cầu

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Đăng xuất
      description: Hủy phiên đăng nhập hiện tại
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Đăng xuất tất cả thiết bị
      description: Hủy tất cả phiên đăng nhập của người dùng
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã đăng xuất khỏi tất cả thiết bị
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Lấy thông tin người dùng hiện tại
      description: Trả về thông tin chi tiết của người dùng đang đăng nhập
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Dictionary
  /api/v1/dictionary:
    get:
      tags:
        - Dictionary
      summary: Lấy danh sách từ điển đã xuất bản
      description: Tìm kiếm và lọc các từ điển với phân trang
      operationId: getDictionaryEntries
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
          description: Lọc theo danh mục
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo từ hoặc định nghĩa
        - name: sort
          in: query
          schema:
            type: string
            enum: [word_asc, word_desc]
          description: >-
            Sắp xếp tên từ tăng/giảm theo tiếng Việt, số theo giá trị tự nhiên,
            trước khi phân trang. Áp dụng cùng tìm kiếm và danh mục.
            Bỏ qua tham số để giữ thứ tự mặc định của API.
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [ BASIC, INTERMEDIATE, ADVANCED ]
          description: Lọc theo độ khó
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng kết quả mỗi trang
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
          description: Bỏ qua n kết quả đầu tiên
      responses:
        '200':
          description: Danh sách từ điển
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictionaryEntry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      skip:
                        type: integer

    post:
      tags:
        - Dictionary
      summary: Tạo từ điển mới (STAFF/ADMIN)
      description: Tạo bản nháp từ điển mới
      operationId: createDictionaryEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - word
                - definition
                - videoUrl
                - categoryId
              properties:
                word:
                  type: string
                  example: "Xin chào"
                definition:
                  type: string
                  example: "Lời chào hỏi khi gặp gỡ"
                videoUrl:
                  type: string
                  example: "https://example.com/videos/xin-chao.mp4"
                categoryId:
                  type: string
                thumbnailUrl:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                difficulty:
                  type: string
                  enum: [ BASIC, INTERMEDIATE, ADVANCED ]
                usageExample:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Từ điển được tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Không có quyền (yêu cầu STAFF hoặc ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

