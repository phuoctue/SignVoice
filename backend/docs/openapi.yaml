  # Dictionary
  /api/v1/dictionary:
    get:
      tags:
        - Dictionary
      summary: Lấy danh sách từ điển đã xuất bản
      description: Tìm kiếm và lọc các từ điển với phân trang
      operationId: getDictionaryEntries
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
          description: Lọc theo danh mục
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo từ hoặc định nghĩa
        - name: sort
          in: query
          schema:
            type: string
            enum: [word_asc, word_desc]
          description: >-
            Sắp xếp tên từ tăng/giảm theo tiếng Việt, số theo giá trị tự nhiên,
            trước khi phân trang. Áp dụng cùng tìm kiếm và danh mục.
            Bỏ qua tham số để giữ thứ tự mặc định của API.
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [ BASIC, INTERMEDIATE, ADVANCED ]
          description: Lọc theo độ khó
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng kết quả mỗi trang
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
          description: Bỏ qua n kết quả đầu tiên
      responses:
        '200':
          description: Danh sách từ điển
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DictionaryEntry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      skip:
                        type: integer

    post:
      tags:
        - Dictionary
      summary: Tạo từ điển mới (STAFF/ADMIN)
      description: Tạo bản nháp từ điển mới
      operationId: createDictionaryEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - word
                - definition
                - videoUrl
                - categoryId
              properties:
                word:
                  type: string
                  example: "Xin chào"
                definition:
                  type: string
                  example: "Lời chào hỏi khi gặp gỡ"
                videoUrl:
                  type: string
                  example: "https://example.com/videos/xin-chao.mp4"
                categoryId:
                  type: string
                thumbnailUrl:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                difficulty:
                  type: string
                  enum: [ BASIC, INTERMEDIATE, ADVANCED ]
                usageExample:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Từ điển được tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/DictionaryEntry'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Không có quyền (yêu cầu STAFF hoặc ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

