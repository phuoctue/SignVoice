          description: Không chấp nhận thời hạn hoặc trường ngoài schema từ client
        '401':
          description: Chưa xác thực
  /api/v1/users/notifications:
    get:
      tags: [Users]
      summary: Thông báo từ mới và ôn tập của tài khoản
      description: Tối đa 50 thông báo trong 30 ngày; chỉ tạo thông báo từ dữ liệu đã xuất bản và tiến độ thật. Không gửi push trong HTTP request.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: data gồm items, unread, pushConfigured
        '401':
          description: Chưa đăng nhập
  /api/v1/users/notifications/{id}:
    patch:
      tags: [Users]
      summary: Đánh dấu thông báo của chính tài khoản là đã đọc
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read: {type: boolean, enum: [true]}
      responses:
        '200': {description: Đã đọc}
        '400': {description: Dữ liệu không hợp lệ}
        '404': {description: Không có thông báo thuộc tài khoản}
  /api/v1/users/notifications/test:
    post:
      tags: [Users]
      summary: Gửi push thử và lưu vào chuông của chính tài khoản
      description: Cần thiết bị Android đã đăng ký, bật nhận thông báo và backend FCM. Giới hạn một lần mỗi 10 giây; không gửi tới tài khoản khác.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '201': {description: data.notification được lưu; data.sent cho biết backend đã gửi thành công tới ít nhất một thiết bị}
        '403': {description: Tài khoản khách không được gửi push}
        '409': {description: Chưa bật thông báo hoặc chưa đăng ký thiết bị}
        '429': {description: Thử quá nhanh}
        '503': {description: Chưa cấu hình máy chủ FCM}
  /api/v1/users/notification-devices:
    post:
      tags: [Users]
      summary: Đăng ký thiết bị nhận FCM cho phiên hiện tại
      description: Một token chỉ thuộc một tài khoản. Thiết bị hết hạn sau 90 ngày nếu không đăng ký lại; không gửi cho phiên đã thu hồi.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, platform]
              properties:
                token: {type: string, minLength: 20, maxLength: 4096, writeOnly: true}
                platform: {type: string, enum: [android, ios]}
      responses:
        '200': {description: Đã đăng ký; pushConfigured phản ánh cấu hình máy chủ}
        '400': {description: Dữ liệu không hợp lệ}
        '403': {description: Tài khoản khách không được đăng ký push}
    delete:
      tags: [Users]
      summary: Gỡ thiết bị thuộc tài khoản
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 20, maxLength: 4096, writeOnly: true}
      responses:
        '200': {description: Đã gỡ nếu thiết bị thuộc tài khoản}
        '400': {description: Dữ liệu không hợp lệ}
  /user-media/avatars/{user}/{file}:
    get:
      tags: [Users]
      summary: Ảnh đại diện đang được tài khoản sử dụng
      security: []
      parameters:
        - in: path
          name: user
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{24}$'}
        - in: path
          name: file
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}\.(jpg|png|webp)$'}
      responses:
        '200': {description: Ảnh JPG/PNG/WebP}
        '404': {description: Không có ảnh hoặc ảnh đã được thay thế}
  /api/v1/guest-trial/ai-ticket:
    post:
      tags: [Authentication]
      summary: Cấp ticket 30 giây để mở WebSocket AI
      description: Kết nối tới /sign-ai/v1/stream?ticket=...; gateway bỏ ticket trước khi chuyển tới AI và đóng kết nối khách tại expiresAt. Không ghi ticket vào log.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ticket chỉ dùng cho kết nối AI, không thay access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
        '401':
          description: Phiên xác thực không còn hợp lệ
        '403':
          description: Phiên thử chưa bắt đầu hoặc đã hết hạn
